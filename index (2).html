<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Player | CodeAlpha</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: linear-gradient(135deg, #0f172a, #312e81 55%, #831843);
    font-family: "Segoe UI", system-ui, sans-serif; color: #fff;
  }
  .player {
    width: 100%; max-width: 380px; padding: 24px; border-radius: 28px;
    background: rgba(255,255,255,.08); backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,.15); box-shadow: 0 25px 60px rgba(0,0,0,.5);
  }
  .cover {
    width: 220px; height: 220px; margin: 0 auto 20px; border-radius: 50%; overflow: hidden;
    box-shadow: 0 12px 35px rgba(0,0,0,.5); animation: spin 14s linear infinite; animation-play-state: paused;
    border: 6px solid rgba(255,255,255,.2);
  }
  .cover.playing { animation-play-state: running; }
  .cover img { width: 100%; height: 100%; object-fit: cover; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .meta { text-align: center; margin-bottom: 18px; }
  .meta h2 { font-size: 1.3rem; }
  .meta p { color: #c4b5fd; margin-top: 4px; }

  .progress-wrap { margin-bottom: 18px; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 3px; background: rgba(255,255,255,.2); outline: none; cursor: pointer; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #f472b6; transition: transform .15s; }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.4); }
  input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border: none; border-radius: 50%; background: #f472b6; }
  .times { display: flex; justify-content: space-between; font-size: .8rem; color: #cbd5e1; margin-top: 6px; }

  .controls { display: flex; align-items: center; justify-content: center; gap: 18px; margin-bottom: 18px; }
  .controls button { background: none; border: none; color: #fff; cursor: pointer; font-size: 1.5rem; transition: transform .15s, color .2s; }
  .controls button:hover { transform: scale(1.15); color: #f472b6; }
  .controls button.on { color: #f472b6; }
  .controls .play { width: 64px; height: 64px; border-radius: 50%; background: #ec4899; font-size: 1.6rem; box-shadow: 0 8px 20px rgba(236,72,153,.5); }
  .controls .play:hover { color: #fff; background: #f472b6; }

  .volume { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .volume span { font-size: 1.2rem; cursor: pointer; }

  .playlist { list-style: none; max-height: 170px; overflow-y: auto; border-top: 1px solid rgba(255,255,255,.15); padding-top: 10px; }
  .playlist li { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-radius: 10px; cursor: pointer; transition: background .2s; font-size: .9rem; }
  .playlist li:hover { background: rgba(255,255,255,.1); }
  .playlist li.active { background: rgba(236,72,153,.3); }
  .playlist small { color: #cbd5e1; }
  .playlist::-webkit-scrollbar { width: 6px; }
  .playlist::-webkit-scrollbar-thumb { background: rgba(255,255,255,.25); border-radius: 3px; }
</style>
</head>
<body>
<div class="player">
  <div class="cover" id="cover"><img id="coverImg" alt="Album cover"></div>
  <div class="meta">
    <h2 id="title">Title</h2>
    <p id="artist">Artist</p>
  </div>

  <div class="progress-wrap">
    <input type="range" id="progress" value="0" min="0" max="100" step="0.1">
    <div class="times"><span id="currentTime">0:00</span><span id="duration">0:00</span></div>
  </div>

  <div class="controls">
    <button id="shuffle" title="Shuffle">🔀</button>
    <button id="prev" title="Previous">⏮</button>
    <button id="play" class="play" title="Play / Pause">▶</button>
    <button id="next" title="Next">⏭</button>
    <button id="repeat" title="Repeat">🔁</button>
  </div>

  <div class="volume">
    <span id="muteBtn">🔊</span>
    <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8">
  </div>

  <ul class="playlist" id="playlist"></ul>
  <audio id="audio" preload="metadata"></audio>
</div>

<script>
  const songs = [
    { title: "Sunrise Drive",   artist: "SoundHelix", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",  cover: "https://picsum.photos/seed/song1/400" },
    { title: "Midnight Echoes", artist: "SoundHelix", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",  cover: "https://picsum.photos/seed/song2/400" },
    { title: "Neon Skyline",    artist: "SoundHelix", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",  cover: "https://picsum.photos/seed/song3/400" },
    { title: "Ocean Breeze",    artist: "SoundHelix", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3",  cover: "https://picsum.photos/seed/song4/400" },
    { title: "Golden Hour",     artist: "SoundHelix", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3",  cover: "https://picsum.photos/seed/song5/400" },
  ];

  const $ = (id) => document.getElementById(id);
  const audio = $("audio"), playBtn = $("play"), progress = $("progress"), volume = $("volume");
  let current = 0, shuffle = false, repeat = false;

  const fmt = (s) => {
    if (!isFinite(s)) return "0:00";
    return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
  };

  // Build playlist
  const list = $("playlist");
  songs.forEach((s, i) => {
    const li = document.createElement("li");
    li.innerHTML = `<span>${i + 1}. ${s.title}</span><small id="d${i}">--:--</small>`;
    li.onclick = () => { loadSong(i); play(); };
    list.appendChild(li);
    // preload durations for the playlist
    const a = new Audio(); a.preload = "metadata"; a.src = s.src;
    a.addEventListener("loadedmetadata", () => ($("d" + i).textContent = fmt(a.duration)));
  });

  function loadSong(i) {
    current = i;
    const s = songs[i];
    audio.src = s.src;
    $("title").textContent = s.title;
    $("artist").textContent = s.artist;
    $("coverImg").src = s.cover;
    progress.value = 0;
    $("currentTime").textContent = "0:00";
    $("duration").textContent = "0:00";
    [...list.children].forEach((li, idx) => li.classList.toggle("active", idx === i));
  }

  function play() { audio.play().catch(() => {}); }
  function pause() { audio.pause(); }

  audio.addEventListener("play",  () => { playBtn.textContent = "⏸"; $("cover").classList.add("playing"); });
  audio.addEventListener("pause", () => { playBtn.textContent = "▶"; $("cover").classList.remove("playing"); });
  playBtn.onclick = () => (audio.paused ? play() : pause());

  function nextSong() {
    let n = shuffle ? Math.floor(Math.random() * songs.length) : (current + 1) % songs.length;
    if (shuffle && songs.length > 1) while (n === current) n = Math.floor(Math.random() * songs.length);
    loadSong(n); play();
  }
  function prevSong() {
    if (audio.currentTime > 3) { audio.currentTime = 0; return; }
    loadSong((current - 1 + songs.length) % songs.length); play();
  }
  $("next").onclick = nextSong;
  $("prev").onclick = prevSong;

  // Autoplay next song when finished
  audio.addEventListener("ended", () => { repeat ? (audio.currentTime = 0, play()) : nextSong(); });

  $("shuffle").onclick = (e) => { shuffle = !shuffle; e.currentTarget.classList.toggle("on", shuffle); };
  $("repeat").onclick = (e) => { repeat = !repeat; e.currentTarget.classList.toggle("on", repeat); };

  // Progress bar
  audio.addEventListener("loadedmetadata", () => ($("duration").textContent = fmt(audio.duration)));
  audio.addEventListener("timeupdate", () => {
    if (audio.duration) progress.value = (audio.currentTime / audio.duration) * 100;
    $("currentTime").textContent = fmt(audio.currentTime);
  });
  progress.addEventListener("input", () => { if (audio.duration) audio.currentTime = (progress.value / 100) * audio.duration; });

  // Volume
  audio.volume = volume.value;
  volume.addEventListener("input", () => {
    audio.volume = volume.value; audio.muted = false;
    $("muteBtn").textContent = audio.volume == 0 ? "🔇" : audio.volume < 0.5 ? "🔉" : "🔊";
  });
  $("muteBtn").onclick = () => {
    audio.muted = !audio.muted;
    $("muteBtn").textContent = audio.muted ? "🔇" : "🔊";
  };

  // Keyboard shortcuts
  document.addEventListener("keydown", (e) => {
    if (e.code === "Space") { e.preventDefault(); playBtn.click(); }
    if (e.code === "ArrowRight") nextSong();
    if (e.code === "ArrowLeft") prevSong();
  });

  loadSong(0);
</script>
</body>
</html>
